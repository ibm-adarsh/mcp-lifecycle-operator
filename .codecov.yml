---
codecov:
  notify:
    after_n_builds: 1
    require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: 50..75

  status:
    project:
      default:
        enabled: true
        # Report coverage; do not fail PRs on small drops until we set a target.
        threshold: null
        if_not_found: success
        if_no_uploads: success
        if_ci_failed: error
    patch:
      default:
        enabled: true
        threshold: null
        if_not_found: success
        if_no_uploads: success
        if_ci_failed: error
    changes: false

comment:
  layout: "header, diff"
  behavior: default
  require_changes: false

ignore:
  - "**/zz_generated.*.go"
  - "**/applyconfiguration/**"
